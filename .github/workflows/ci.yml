name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: kpiso
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Tests
        working-directory: ./KPIso-backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/kpiso
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
        run: mvn -B clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: KPIso-backend/target/site/jacoco/

      - name: Add JaCoCo Report to Job Summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          import os

          xml_path = 'KPIso-backend/target/site/jacoco/jacoco.xml'
          if not os.path.exists(xml_path):
              print('Reporte jacoco.xml no encontrado.')
              exit(0)

          tree = ET.parse(xml_path)
          root = tree.getroot()
          
          summary = []
          summary.append('# 📊 Cobertura de Código (JaCoCo)')
          summary.append('| Métrica | Cubierto | Perdido | Porcentaje |')
          summary.append('| --- | --- | --- | --- |')

          for counter in root.findall('counter'):
              c_type = counter.get('type')
              missed = int(counter.get('missed'))
              covered = int(counter.get('covered'))
              total = missed + covered
              percentage = (covered / total * 100) if total > 0 else 0
              summary.append(f'| {c_type} | {covered} | {missed} | {percentage:.2f}% |')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary))
          "

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./KPIso-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./KPIso-frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./KPIso-frontend
        run: npm run build
