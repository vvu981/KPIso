# Configuración General de la Aplicación
spring.application.name=kpiso-backend

# Conexión a la Base de Datos (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kpiso}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración del Historial y Auditoría Automatizada (Hibernate Envers)
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Configuración del Servidor Web
server.port=8080
server.servlet.context-path=/api/v1

# Configuración de Open Food Facts (fallback cuando scraper no disponible)
openfoody.facts.timeout=5000

# URL del microservicio scraper de productos
# En Docker Compose se resuelve por nombre de servicio; en local apunta a localhost
scraper.service.url=${SCRAPER_URL:http://localhost:8081}